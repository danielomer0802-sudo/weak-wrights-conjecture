name: Lean verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build the modular library
        uses: leanprover/lean-action@v1
        with:
          build: true
          build-args: "--wfail"
          test: false
          lint: false
          use-mathlib-cache: true
      - name: Audit all project declarations
        run: lake env lean -DwarningAsError=true Audit.lean
      - name: Check standalone synchronization
        run: python3 scripts/make_standalone.py --check
      - name: Check the standalone formalization
        run: lake env lean -DwarningAsError=true standalone/Operator_Phase_Retrieval_Standalone.lean
